<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Pixel scanline filter -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#aa00ff" />
    </linearGradient>

    <linearGradient id="arcadeYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <filter id="pixelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .arcade-cabinet {
        cursor: pointer;
      }

      /* 8-bit Player Sprite Idle Hop */
      .player-sprite {
        transform-origin: 400px 165px;
        animation: pixelHop 1s steps(2, start) infinite;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes pixelHop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      /* Floating Coins / Stars */
      .coin-1 {
        transform-origin: 320px 145px;
        animation: coinSpin 1.4s ease-in-out infinite alternate;
      }
      .coin-2 {
        transform-origin: 480px 145px;
        animation: coinSpin 1.4s ease-in-out infinite alternate 0.7s;
      }

      @keyframes coinSpin {
        0% { transform: scaleX(1); fill: #ffe600; }
        50% { transform: scaleX(0.2); fill: #ff9900; }
        100% { transform: scaleX(1); fill: #ffe600; }
      }

      /* CRT Scanline Beam */
      .scanline-beam {
        animation: scanlineMove 4s linear infinite;
      }

      @keyframes scanlineMove {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.25; }
        100% { transform: translateY(320px); opacity: 0; }
      }

      /* Arcade Blinking "INSERT COIN" */
      .blink-text {
        animation: arcadeBlink 1.2s steps(2, start) infinite;
      }

      @keyframes arcadeBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Game Controllers */
      .arcade-btn {
        transition: transform 0.2s ease, fill 0.2s ease;
      }

      /* ========================================================
         MOUSE HOVER MOTION - 8-BIT COMBO MODE!
         ======================================================== */
      .arcade-cabinet:hover .player-sprite {
        transform: scale(1.35) translateY(-20px);
        filter: drop-shadow(0 0 20px #00ffcc);
      }

      .arcade-cabinet:hover .arcade-screen-bg {
        stroke: #ff007f;
        stroke-width: 3;
      }

      .arcade-cabinet:hover .dpad-center {
        fill: #00ffcc;
      }

      .arcade-cabinet:hover .btn-a {
        transform: translateY(3px);
        fill: #00ffcc;
      }

      .arcade-cabinet:hover .btn-b {
        transform: translateY(3px);
        fill: #ffe600;
      }

      .arcade-cabinet:hover .header-banner {
        fill: #ff007f;
        letter-spacing: 5px;
      }

      .arcade-cabinet:hover .score-num {
        fill: #ffe600;
      }

      .pixel-font {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-weight: bold;
      }
    </style>
  </defs>

  <!-- Arcade Bezel Background -->
  <rect width="100%" height="100%" fill="#090514" rx="20" stroke="#ff007f" stroke-width="3"/>

  <!-- Inner Arcade CRT Screen Frame -->
  <rect class="arcade-screen-bg" x="30" y="30" width="740" height="260" rx="14" fill="url(#screenGrad)" stroke="#00f0ff" stroke-width="2" style="transition: stroke 0.4s ease;"/>

  <!-- Scanlines Effect -->
  <g opacity="0.08">
    <line x1="30" y1="50" x2="770" y2="50" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="70" x2="770" y2="70" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="90" x2="770" y2="90" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="110" x2="770" y2="110" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="130" x2="770" y2="130" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="150" x2="770" y2="150" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="170" x2="770" y2="170" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="190" x2="770" y2="190" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="210" x2="770" y2="210" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="230" x2="770" y2="230" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="250" x2="770" y2="250" stroke="#00ffcc" stroke-width="2"/>
    <line x1="30" y1="270" x2="770" y2="270" stroke="#00ffcc" stroke-width="2"/>
  </g>

  <!-- Glowing CRT Beam -->
  <rect class="scanline-beam" x="30" y="30" width="740" height="40" fill="#00ffcc" opacity="0.15"/>

  <g class="arcade-cabinet">
    <!-- Top HUD: Scores -->
    <text class="pixel-font" x="60" y="65" font-size="13" fill="#ff007f">1UP</text>
    <text class="pixel-font score-num" x="60" y="88" font-size="14" fill="#00f0ff" style="transition: fill 0.3s ease;">999990</text>

    <text class="pixel-font header-banner" x="400" y="68" text-anchor="middle" font-size="15" fill="#ffe600" style="transition: all 0.4s ease;">★ WORKINGGUY4321 ARCADE ★</text>
    <text class="pixel-font" x="400" y="90" text-anchor="middle" font-size="10" fill="#38bdf8">STAGE 01: WINDOWS UTILITY CORE</text>

    <text class="pixel-font" x="740" y="65" text-anchor="end" font-size="13" fill="#ff007f">HI-SCORE</text>
    <text class="pixel-font" x="740" y="88" text-anchor="end" font-size="14" fill="#00ffcc">1000000</text>

    <!-- Retro Floor Grid -->
    <line x1="80" y1="230" x2="720" y2="230" stroke="#00f0ff" stroke-width="3" filter="url(#pixelGlow)"/>
    <line x1="80" y1="238" x2="720" y2="238" stroke="#ff007f" stroke-width="1.5"/>

    <!-- Left Coin / Power-up -->
    <g class="coin-1">
      <circle cx="300" cy="165" r="14" fill="#ffe600" stroke="#ffffff" stroke-width="2" filter="url(#pixelGlow)"/>
      <text class="pixel-font" x="300" y="171" text-anchor="middle" font-size="12" fill="#000000">$</text>
    </g>

    <!-- Right Diamond Power-up -->
    <g class="coin-2">
      <polygon points="500,150 514,165 500,180 486,165" fill="#00f0ff" stroke="#ffffff" stroke-width="2" filter="url(#pixelGlow)"/>
      <circle cx="500" cy="165" r="3" fill="#ffffff"/>
    </g>

    <!-- 8-Bit Pixel Character / Robot Builder Sprite -->
    <g class="player-sprite">
      <!-- Robot Helmet & Antenna -->
      <rect x="396" y="112" width="8" height="10" fill="#ffe600"/>
      <circle cx="400" cy="108" r="5" fill="#ff007f" filter="url(#pixelGlow)"/>

      <!-- Robot Head -->
      <rect x="375" y="122" width="50" height="34" rx="4" fill="#00f0ff" stroke="#020c1b" stroke-width="3"/>
      <!-- Visor / Eyes -->
      <rect x="382" y="132" width="14" height="12" fill="#020c1b"/>
      <rect x="384" y="134" width="8" height="6" fill="#00ffcc"/>
      <rect x="404" y="132" width="14" height="12" fill="#020c1b"/>
      <rect x="406" y="134" width="8" height="6" fill="#00ffcc"/>

      <!-- Body -->
      <rect x="380" y="160" width="40" height="36" rx="4" fill="#ff007f" stroke="#020c1b" stroke-width="3"/>
      <!-- Core Badge / Chest Screen -->
      <rect x="390" y="168" width="20" height="14" fill="#020c1b"/>
      <circle cx="400" cy="175" r="4" fill="#ffe600"/>

      <!-- Arms -->
      <rect x="365" y="165" width="12" height="22" rx="3" fill="#00f0ff" stroke="#020c1b" stroke-width="2"/>
      <rect x="423" y="165" width="12" height="22" rx="3" fill="#00f0ff" stroke="#020c1b" stroke-width="2"/>

      <!-- Legs -->
      <rect x="385" y="200" width="12" height="24" fill="#38bdf8" stroke="#020c1b" stroke-width="2"/>
      <rect x="403" y="200" width="12" height="24" fill="#38bdf8" stroke="#020c1b" stroke-width="2"/>
      <!-- Boots -->
      <rect x="381" y="222" width="16" height="8" fill="#ffe600"/>
      <rect x="403" y="222" width="16" height="8" fill="#ffe600"/>
    </g>

    <!-- Retro Arcade Joystick & D-Pad (Left Side) -->
    <g transform="translate(110, 155)">
      <circle cx="25" cy="25" r="28" fill="#020c1b" stroke="#334155" stroke-width="2"/>
      <!-- D-Pad Cross -->
      <rect class="arcade-btn dpad-center" x="19" y="5" width="12" height="40" rx="3" fill="#64748b"/>
      <rect class="arcade-btn dpad-center" x="5" y="19" width="40" height="12" rx="3" fill="#64748b"/>
      <circle cx="25" cy="25" r="4" fill="#020c1b"/>
    </g>

    <!-- Arcade Action Buttons (Right Side) -->
    <g transform="translate(630, 150)">
      <circle class="arcade-btn btn-a" cx="20" cy="35" r="14" fill="#ff007f" stroke="#ffffff" stroke-width="2" filter="url(#pixelGlow)"/>
      <text class="pixel-font" x="20" y="41" text-anchor="middle" font-size="11" fill="#ffffff">A</text>

      <circle class="arcade-btn btn-b" cx="55" cy="20" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="2" filter="url(#pixelGlow)"/>
      <text class="pixel-font" x="55" y="26" text-anchor="middle" font-size="11" fill="#020c1b">B</text>
    </g>

    <!-- Bottom Blinking Prompt -->
    <text class="pixel-font blink-text" x="400" y="270" text-anchor="middle" font-size="12" fill="#00ffcc">► HOVER MOUSE TO POWER UP / PLAY ◄</text>
  </g>
</svg>