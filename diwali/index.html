<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🚀 DIWALI SKY SHOT & BIJILI SIMULATOR 🪔 // Happy Deepavali!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #02030a;
      color: #ffd700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #stage-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
    }
    /* Header HUD */
    #top-hud {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }
    h1 {
      font-size: clamp(22px, 4.2vw, 38px);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffe066, #ff8c00, #ff0055, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 140, 0, 0.6);
      animation: pulseTitle 2s ease-in-out infinite alternate;
    }
    @keyframes pulseTitle {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.02); }
    }
    #hint-bar {
      font-size: clamp(13px, 1.8vw, 16px);
      color: #fff2a3;
      margin-top: 6px;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
      background: rgba(8, 4, 18, 0.7);
      display: inline-block;
      padding: 5px 22px;
      border-radius: 20px;
      border: 1px solid rgba(255, 153, 0, 0.4);
    }
    /* Top Controls */
    #top-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 30;
      display: flex;
      gap: 10px;
    }
    .hud-btn {
      background: rgba(18, 10, 35, 0.85);
      border: 1.5px solid #ff9900;
      color: #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.3);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    .hud-btn:hover, .hud-btn.active {
      background: linear-gradient(135deg, #ff9900, #ff0055);
      color: #ffffff;
      transform: scale(1.05);
    }
    /* Cracker Dock (Sky Shot, Bijili & Sparkler) */
    #cracker-dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(10, 5, 25, 0.92);
      border: 2px solid #ff9900;
      border-radius: 50px;
      padding: 10px 22px;
      display: flex;
      gap: 15px;
      box-shadow: 0 0 35px rgba(255, 153, 0, 0.45);
      backdrop-filter: blur(12px);
    }
    .dock-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 153, 0, 0.35);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .dock-btn span {
      font-size: 20px;
    }
    .dock-btn:hover {
      background: rgba(255, 153, 0, 0.25);
      border-color: #ffd700;
    }
    .dock-btn.active {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      border-color: #00ffff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      transform: translateY(-3px) scale(1.06);
    }
    #flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.08s ease-out;
    }
  </style>
</head>
<body>

  <div id="flash"></div>

  <div id="stage-container">
    <div id="top-hud">
      <h1>🪔 HAPPY DIWALI 🪔</h1>
      <div id="hint-bar">🚀 Click anywhere in the sky to launch colorful Sky Shots!</div>
    </div>

    <div id="top-controls">
      <button class="hud-btn" id="auto-btn">🎆 Auto Sky Shots: OFF</button>
      <button class="hud-btn" id="sound-btn">🔊 Sound: ON</button>
    </div>

    <!-- Dock: Only Sky Shot, Bijili & Sparkler -->
    <div id="cracker-dock">
      <button class="dock-btn active" data-type="skyshot"><span>🚀</span> Sky Shot (Fireworks)</button>
      <button class="dock-btn" data-type="bijili"><span>🧨</span> Red Bijili Cracker</button>
      <button class="dock-btn" data-type="sparkler"><span>✨</span> Sparkler</button>
    </div>

    <canvas id="mainCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('flash');
    const hintEl = document.getElementById('hint-bar');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio Synthesizer (Whistle, Loud Boom, Bijili Snap & Crackle)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'whistle') {
        // High-pitched screeching rocket ascent
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(1800, now + 0.6);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
      else if (type === 'skyboom') {
        // Huge Thunderous Aerial Explosion
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.55);
        gain.gain.setValueAtTime(0.95, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);

        // Crackling air burst noise
        const bufferSize = audioCtx.sampleRate * 0.45;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(120, now + 0.45);
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.65, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(now);
      }
      else if (type === 'snap') {
        // Sharp Bijili Crack
        const snapBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
        const data = snapBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const source = audioCtx.createBufferSource();
        source.buffer = snapBuf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2200, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(now);
      }
      else if (type === 'hiss') {
        const bufferSize = audioCtx.sampleRate * 0.25;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(3200, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      }
      else if (type === 'crackle') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(Math.random() * 900 + 400, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
        osc.start(now);
        osc.stop(now + 0.04);
      }
    }

    function screenFlash(opacity = 0.45) {
      flashEl.style.opacity = opacity;
      setTimeout(() => { flashEl.style.opacity = '0'; }, 85);
    }

    // Entities Arrays
    let skyShots = [];
    let groundBijilis = [];
    let particles = [];
    let paperShreds = [];
    let scorchMarks = [];

    // Background Stars
    const stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * (window.innerHeight * 0.65),
        size: Math.random() * 1.8 + 0.5,
        alpha: Math.random() * 0.6 + 0.3
      });
    }

    // Color Palettes for Sky Shot
    const colorThemes = [
      ['#ff0055', '#ff9900', '#ffd700'], // Fire Red & Gold
      ['#00ffff', '#00ff66', '#ffffff'], // Neon Cyan & Emerald
      ['#c084fc', '#ff00aa', '#00f0ff'], // Cosmic Purple & Magenta
      ['#ffe600', '#ffffff', '#ff3300'], // Golden Glitter Rain
      ['#00ff99', '#38bdf8', '#a855f7']  // Aurora Sky
    ];

    // Particle Class
    class Particle {
      constructor(x, y, color, vx, vy, life = 1, size = 3, gravity = 0.07, friction = 0.97, spark = true) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
        this.alpha = life;
        this.decay = Math.random() * 0.02 + 0.012;
        this.size = size;
        this.gravity = gravity;
        this.friction = friction;
        this.spark = spark;
      }
      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        this.size = Math.max(0.2, this.size * 0.98);
        return this.alpha > 0;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.spark ? 14 : 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ==========================================
    // 1. SKY SHOT (MAGNIFICENT AERIAL FIREWORK)
    // ==========================================
    class SkyShot {
      constructor(targetX, targetY) {
        this.targetX = targetX;
        this.targetY = Math.min(targetY, canvas.height * 0.55);
        this.x = targetX + (Math.random() * 40 - 20);
        this.y = canvas.height * 0.72; // Launch from ground mortar
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);
        const speed = Math.random() * 3 + 14;
        this.vx = (dx / dist) * speed;
        this.vy = (dy / dist) * speed;
        this.palette = colorThemes[Math.floor(Math.random() * colorThemes.length)];
        playSound('whistle');
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Glowing Golden Fire Trail
        for (let i = 0; i < 3; i++) {
          particles.push(new Particle(
            this.x, this.y, '#ffd700',
            (Math.random() - 0.5) * 2, Math.random() * 2 + 1,
            0.6, 2.5, 0.02, 0.96
          ));
        }

        // Burst when reached apex
        if (this.vy >= 0 || this.y <= this.targetY) {
          this.burst();
          return false;
        }
        return true;
      }
      burst() {
        playSound('skyboom');
        screenFlash(0.4);

        const count = Math.floor(Math.random() * 40 + 90);
        const pattern = Math.random();

        for (let i = 0; i < count; i++) {
          let angle, speed;
          if (pattern > 0.4) {
            // Spherical Peony Burst
            angle = Math.random() * Math.PI * 2;
            speed = Math.random() * 9 + 2;
          } else {
            // Double Ring Burst
            angle = (i / count) * Math.PI * 2;
            speed = (i % 2 === 0 ? 7 : 4.5) + Math.random() * 1.5;
          }

          const color = this.palette[Math.floor(Math.random() * this.palette.length)];
          particles.push(new Particle(
            this.x, this.y, color,
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            1, Math.random() * 3.5 + 2, 0.065, 0.96, true
          ));
        }

        // Extra cascading golden willow rain sparks
        for (let i = 0; i < 25; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 4 + 1;
          particles.push(new Particle(
            this.x, this.y, '#ffffff',
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            1.2, 2, 0.12, 0.98, true
          ));
        }
      }
      draw() {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ==========================================
    // 2. RED BIJILI CRACKER (ON GROUND)
    // ==========================================
    class BijiliCracker {
      constructor(x, y) {
        this.x = x;
        this.y = Math.max(canvas.height * 0.65, Math.min(canvas.height - 85, y));
        this.fuse = 45;
        this.state = 'burning';
        playSound('hiss');
      }
      update() {
        if (this.state === 'burning') {
          this.fuse--;
          for (let i = 0; i < 2; i++) {
            particles.push(new Particle(
              this.x, this.y - 48 + (45 - this.fuse) * 0.8, '#ffaa00',
              (Math.random() - 0.5) * 3, -Math.random() * 3, 0.4, 2
            ));
          }
          if (Math.random() < 0.25) playSound('crackle');

          if (this.fuse <= 0) {
            this.explode();
            return false;
          }
        }
        return true;
      }
      explode() {
        playSound('snap');
        screenFlash(0.5);
        scorchMarks.push({ x: this.x, y: this.y + 10, radius: 45 });

        // Red & Gold Paper Shreds flying out
        for (let i = 0; i < 45; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 12 + 3;
          paperShreds.push({
            x: this.x,
            y: this.y - 15,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            color: Math.random() > 0.3 ? '#ff2222' : '#ffd700',
            size: Math.random() * 8 + 4,
            rotation: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.4,
            alpha: 1
          });
        }

        // Fiery sparks
        for (let i = 0; i < 55; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 14 + 2;
          particles.push(new Particle(
            this.x, this.y - 15, Math.random() > 0.4 ? '#ffcc00' : '#ffffff',
            Math.cos(angle) * speed, Math.sin(angle) * speed, 1, 3, 0.1
          ));
        }
      }
      draw() {
        ctx.save();
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 22, 20, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Twisted Fuse
        const fuseTopY = this.y - 20 - (this.fuse / 45) * 26;
        ctx.strokeStyle = '#a68a56';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 20);
        ctx.lineTo(this.x + 4, fuseTopY);
        ctx.stroke();

        // Spark at fuse tip
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ff5500';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(this.x + 4, fuseTopY, 4, 0, Math.PI * 2);
        ctx.fill();

        // Red Bijili Tube
        const grad = ctx.createLinearGradient(this.x - 12, 0, this.x + 12, 0);
        grad.addColorStop(0, '#990000');
        grad.addColorStop(0.4, '#ff2222');
        grad.addColorStop(1, '#660000');
        ctx.fillStyle = grad;
        ctx.fillRect(this.x - 10, this.y - 20, 20, 42);

        // Gold Twine Rings
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x - 10, this.y - 10); ctx.lineTo(this.x + 10, this.y - 10);
        ctx.moveTo(this.x - 10, this.y); ctx.lineTo(this.x + 10, this.y);
        ctx.moveTo(this.x - 10, this.y + 10); ctx.lineTo(this.x + 10, this.y + 10);
        ctx.stroke();

        ctx.restore();
      }
    }

    // Active Selection State
    let currentType = 'skyshot';
    const dockButtons = document.querySelectorAll('.dock-btn');
    dockButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        initAudio();
        dockButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.getAttribute('data-type');
        updateHint();
      });
    });

    function updateHint() {
      if (currentType === 'skyshot') hintEl.innerText = '🚀 Click anywhere in the sky to launch colorful Sky Shots!';
      else if (currentType === 'bijili') hintEl.innerText = '🧨 Click ground to place & light a Red Bijili cracker!';
      else if (currentType === 'sparkler') hintEl.innerText = '✨ Drag mouse or touch to draw sparkling golden trails!';
    }
    updateHint();

    // Canvas Click Interactions
    canvas.addEventListener('click', (e) => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (currentType === 'skyshot') {
        skyShots.push(new SkyShot(x, y));
      } else if (currentType === 'bijili') {
        groundBijilis.push(new BijiliCracker(x, y));
      } else if (currentType === 'sparkler') {
        makeSparkler(x, y);
      }
    });

    // Sparkler Dragging
    let isDragging = false;
    canvas.addEventListener('mousedown', () => { isDragging = true; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging && currentType === 'sparkler') {
        makeSparkler(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      if (currentType === 'sparkler') {
        const touch = e.touches[0];
        makeSparkler(touch.clientX, touch.clientY);
      }
    }, { passive: true });

    function makeSparkler(x, y) {
      initAudio();
      for (let i = 0; i < 7; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push(new Particle(
          x, y, '#ffd700',
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          0.6, Math.random() * 2.5 + 1, 0.05
        ));
      }
      if (Math.random() < 0.25) playSound('crackle');
    }

    // Auto Fireworks Show Toggle
    let autoShow = false;
    let autoInterval = null;
    const autoBtn = document.getElementById('auto-btn');
    autoBtn.addEventListener('click', () => {
      initAudio();
      autoShow = !autoShow;
      if (autoShow) {
        autoBtn.innerText = '🎆 Auto Sky Shots: ON';
        autoBtn.classList.add('active');
        autoInterval = setInterval(() => {
          const rx = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
          const ry = Math.random() * (canvas.height * 0.4) + canvas.height * 0.1;
          skyShots.push(new SkyShot(rx, ry));
        }, 750);
      } else {
        autoBtn.innerText = '🎆 Auto Sky Shots: OFF';
        autoBtn.classList.remove('active');
        clearInterval(autoInterval);
      }
    });

    // Sound Button
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.innerText = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: MUTED';
    });

    // Main Render Loop
    function loop() {
      // Semi-clear for particle trails
      ctx.fillStyle = 'rgba(2, 3, 10, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sky Stars
      ctx.fillStyle = '#ffffff';
      for (let s of stars) {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
      ctx.globalAlpha = 1;

      // Ground Surface
      const groundY = canvas.height * 0.70;
      const gGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
      gGrad.addColorStop(0, '#160e28');
      gGrad.addColorStop(0.3, '#10091e');
      gGrad.addColorStop(1, '#07030e');
      ctx.fillStyle = gGrad;
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // Glowing Ground Border
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#ff8800';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Draw Scorch Marks
      for (let sm of scorchMarks) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.beginPath();
        ctx.ellipse(sm.x, sm.y, sm.radius, sm.radius * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Paper Shreds
      for (let i = paperShreds.length - 1; i >= 0; i--) {
        const p = paperShreds[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28;
        p.vx *= 0.96;
        p.rotation += p.rotSpeed;
        p.alpha -= 0.008;

        if (p.y > canvas.height - 70) {
          p.y = canvas.height - 70;
          p.vy = -p.vy * 0.2;
          p.vx *= 0.6;
        }

        if (p.alpha <= 0) {
          paperShreds.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }

      // Ground Bijilis
      for (let i = groundBijilis.length - 1; i >= 0; i--) {
        if (!groundBijilis[i].update()) {
          groundBijilis.splice(i, 1);
        } else {
          groundBijilis[i].draw();
        }
      }

      // Sky Shots
      for (let i = skyShots.length - 1; i >= 0; i--) {
        if (!skyShots[i].update()) {
          skyShots.splice(i, 1);
        } else {
          skyShots[i].draw();
        }
      }

      // Sparks & Burst Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        if (!particles[i].update()) {
          particles.splice(i, 1);
        } else {
          particles[i].draw();
        }
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
