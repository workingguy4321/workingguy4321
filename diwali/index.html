<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>💥 BIJILI CRACKER SIMULATOR // Real Diwali Lighting Experience</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #08050e;
      color: #ffd700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: none; /* Agarbatti replaces cursor */
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Top Title HUD */
    #hud {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    h1 {
      font-size: clamp(22px, 3.5vw, 36px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #ff3333;
      text-shadow: 0 0 15px rgba(255, 51, 51, 0.8), 0 0 30px rgba(255, 204, 0, 0.6);
    }
    .instruction {
      font-size: clamp(13px, 1.8vw, 16px);
      color: #ffe066;
      margin-top: 5px;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
      background: rgba(0,0,0,0.4);
      display: inline-block;
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 204, 0, 0.3);
    }
    /* Bottom Controls */
    #bottom-bar {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 20;
    }
    .action-btn {
      background: linear-gradient(135deg, #ff2222, #b30000);
      border: 2px solid #ffd700;
      color: #ffffff;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 34, 34, 0.5);
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
    }
    #flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.08s ease-out;
    }
  </style>
</head>
<body>

  <div id="flash"></div>

  <div id="game-container">
    <div id="hud">
      <h1>🧨 DIWALI BIJILI CRACKER SIMULATOR 🧨</h1>
      <div class="instruction">🔥 Bring the burning Agarbatti to the fuse to light it! 🔥</div>
    </div>

    <canvas id="stageCanvas"></canvas>

    <div id="bottom-bar">
      <button class="action-btn" id="new-cracker-btn">🧨 Place New Bijili</button>
      <button class="action-btn" id="sound-btn" style="background: #222; border-color: #ff9900;">🔊 Sound: ON</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stageCanvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('flash');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio Synthesizer (Realistic Sizzle + Loud Bijili Blast)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSizzle() {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      // High-pitched hissing spark sound
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(3500, now);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.18, now);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    function playBigiliBlast() {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;

      // 1. Sharp high-frequency transient SNAP / CRACK
      const snapBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
      const snapData = snapBuf.getChannelData(0);
      for (let i = 0; i < snapBuf.length; i++) {
        snapData[i] = Math.random() * 2 - 1;
      }
      const snapSource = audioCtx.createBufferSource();
      snapSource.buffer = snapBuf;
      const snapFilter = audioCtx.createBiquadFilter();
      snapFilter.type = 'bandpass';
      snapFilter.frequency.setValueAtTime(2400, now);
      const snapGain = audioCtx.createGain();
      snapGain.gain.setValueAtTime(1.0, now);
      snapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
      snapSource.connect(snapFilter);
      snapFilter.connect(snapGain);
      snapGain.connect(audioCtx.destination);
      snapSource.start(now);

      // 2. Heavy sub-bass BOOM shockwave
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(32, now + 0.45);
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);

      // 3. Post-explosion reverberating smoke echo
      const echoBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
      const echoData = echoBuf.getChannelData(0);
      for (let i = 0; i < echoBuf.length; i++) {
        echoData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.12));
      }
      const echoSource = audioCtx.createBufferSource();
      echoSource.buffer = echoBuf;
      const echoFilter = audioCtx.createBiquadFilter();
      echoFilter.type = 'lowpass';
      echoFilter.frequency.setValueAtTime(800, now);
      const echoGain = audioCtx.createGain();
      echoGain.gain.setValueAtTime(0.5, now);
      echoGain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      echoSource.connect(echoFilter);
      echoFilter.connect(echoGain);
      echoGain.connect(audioCtx.destination);
      echoSource.start(now);
    }

    // Mouse / Cursor Tracking (Agarbatti position)
    const mouse = { x: -100, y: -100 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('touchmove', (e) => {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchstart', (e) => {
      initAudio();
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }, { passive: true });

    // Bijili Cracker State
    const cracker = {
      x: 0,
      y: 0,
      width: 32,
      height: 130,
      state: 'ready', // 'ready', 'burning', 'exploded'
      fuseLength: 50,
      maxFuse: 50,
      burnRate: 0.35,
      scorchMarks: []
    };

    function resetCracker() {
      cracker.x = canvas.width / 2;
      cracker.y = canvas.height * 0.62;
      cracker.state = 'ready';
      cracker.fuseLength = cracker.maxFuse;
      sparks = [];
      paperShreds = [];
      smoke = [];
    }
    resetCracker();
    window.addEventListener('resize', resetCracker);

    // Particle Arrays
    let sparks = [];
    let paperShreds = [];
    let smoke = [];

    // Screen shake variable
    let screenShake = 0;

    // Explode Function
    function explodeCracker() {
      cracker.state = 'exploded';
      screenShake = 24; // strong shake
      playBigiliBlast();

      // Screen Flash
      flashEl.style.opacity = '0.9';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 90);

      // Save Scorch Mark on ground
      cracker.scorchMarks.push({
        x: cracker.x,
        y: cracker.y + 20,
        radius: 65 + Math.random() * 20
      });

      // 1. Red & Gold Paper Shreds flying out
      for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 14 + 3;
        paperShreds.push({
          x: cracker.x,
          y: cracker.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - Math.random() * 5,
          color: Math.random() > 0.3 ? '#e60000' : '#ffd700',
          size: Math.random() * 10 + 4,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.4,
          life: 1,
          decay: Math.random() * 0.01 + 0.005
        });
      }

      // 2. Fiery Sparks
      for (let i = 0; i < 110; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 18 + 4;
        sparks.push({
          x: cracker.x,
          y: cracker.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - Math.random() * 4,
          color: Math.random() > 0.4 ? '#ffcc00' : '#ffffff',
          size: Math.random() * 3.5 + 1.5,
          life: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }

      // 3. Thick Smoke Cloud
      for (let i = 0; i < 40; i++) {
        smoke.push({
          x: cracker.x + (Math.random() * 40 - 20),
          y: cracker.y + (Math.random() * 20 - 10),
          vx: (Math.random() - 0.5) * 2.5,
          vy: -Math.random() * 2.5 - 0.8,
          radius: Math.random() * 25 + 15,
          alpha: 0.75,
          growth: Math.random() * 0.8 + 0.5,
          decay: Math.random() * 0.008 + 0.004
        });
      }
    }

    // Main Draw & Update Loop
    function loop() {
      // Screen Shake Transform
      let shakeX = 0;
      let shakeY = 0;
      if (screenShake > 0) {
        shakeX = (Math.random() - 0.5) * screenShake;
        shakeY = (Math.random() - 0.5) * screenShake;
        screenShake *= 0.88;
        if (screenShake < 0.5) screenShake = 0;
      }

      ctx.save();
      ctx.translate(shakeX, shakeY);

      // Clear Stage (Night ground pavement)
      ctx.fillStyle = '#0a0614';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pavement Ground Perspective Line
      const horizonY = canvas.height * 0.48;
      const groundGrad = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
      groundGrad.addColorStop(0, '#150f24');
      groundGrad.addColorStop(1, '#090510');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

      // Ground Texture lines
      ctx.strokeStyle = '#1e1435';
      ctx.lineWidth = 1.5;
      for (let x = -200; x < canvas.width + 400; x += 120) {
        ctx.beginPath();
        ctx.moveTo(x, horizonY);
        ctx.lineTo(x + (x - canvas.width / 2) * 1.5, canvas.height);
        ctx.stroke();
      }

      // Draw Scorch Marks
      for (let sm of cracker.scorchMarks) {
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.beginPath();
        ctx.ellipse(sm.x, sm.y, sm.radius, sm.radius * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Calculate Fuse Coordinates
      const crackerTopX = cracker.x;
      const crackerTopY = cracker.y - cracker.height / 2;
      const currentFuseHeight = (cracker.fuseLength / cracker.maxFuse) * 55;
      const fuseTipX = crackerTopX + Math.sin(currentFuseHeight * 0.1) * 12;
      const fuseTipY = crackerTopY - currentFuseHeight;

      // ==========================================
      // CHECK AGARBATTI / MATCH LIGHTING CONTACT
      // ==========================================
      if (cracker.state === 'ready') {
        const distToFuseTip = Math.hypot(mouse.x - fuseTipX, mouse.y - fuseTipY);
        if (distToFuseTip < 28) {
          initAudio();
          cracker.state = 'burning';
        }
      }

      // ==========================================
      // FUSE BURNING LOGIC
      // ==========================================
      if (cracker.state === 'burning') {
        cracker.fuseLength -= cracker.burnRate;

        // Fuse sputtering sparks
        for (let i = 0; i < 3; i++) {
          sparks.push({
            x: fuseTipX,
            y: fuseTipY,
            vx: (Math.random() - 0.5) * 5,
            vy: -Math.random() * 4 - 1,
            color: Math.random() > 0.3 ? '#ffaa00' : '#ffffff',
            size: Math.random() * 3 + 1,
            life: 1,
            decay: Math.random() * 0.08 + 0.04
          });
        }

        // Small wisp of smoke from burning fuse
        if (Math.random() < 0.6) {
          smoke.push({
            x: fuseTipX,
            y: fuseTipY,
            vx: (Math.random() - 0.5) * 1.2,
            vy: -Math.random() * 2 - 0.5,
            radius: Math.random() * 8 + 4,
            alpha: 0.6,
            growth: 0.3,
            decay: 0.02
          });
        }

        // Sizzle audio
        if (Math.random() < 0.3) playSizzle();

        // When fuse burns down completely -> BOOM!
        if (cracker.fuseLength <= 0) {
          explodeCracker();
        }
      }

      // ==========================================
      // DRAW BIJILI CRACKER (IF NOT EXPLODED)
      // ==========================================
      if (cracker.state !== 'exploded') {
        ctx.save();

        // 1. Shadow underneath cracker
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(cracker.x, cracker.y + cracker.height / 2 + 8, cracker.width * 1.2, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. The Burning Twisted Gunpowder Fuse (Thiri)
        if (cracker.fuseLength > 0) {
          ctx.strokeStyle = '#8c7853';
          ctx.lineWidth = 3.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(crackerTopX, crackerTopY);
          ctx.quadraticCurveTo(
            crackerTopX + 15, crackerTopY - currentFuseHeight * 0.5,
            fuseTipX, fuseTipY
          );
          ctx.stroke();

          // If burning, draw spark ember on fuse tip
          if (cracker.state === 'burning') {
            ctx.shadowColor = '#ff5500';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(fuseTipX, fuseTipY, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff8800';
            ctx.beginPath();
            ctx.arc(fuseTipX, fuseTipY, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        // 3. The Red Bijili Paper Cylindrical Body
        const left = cracker.x - cracker.width / 2;
        const top = crackerTopY;
        const w = cracker.width;
        const h = cracker.height;

        // Gradient for 3D round cylinder effect
        const cylGrad = ctx.createLinearGradient(left, 0, left + w, 0);
        cylGrad.addColorStop(0, '#800000');
        cylGrad.addColorStop(0.35, '#ff2222');
        cylGrad.addColorStop(0.7, '#cc0000');
        cylGrad.addColorStop(1, '#550000');

        ctx.fillStyle = cylGrad;
        ctx.beginPath();
        ctx.roundRect(left, top, w, h, [6, 6, 4, 4]);
        ctx.fill();

        // 4. Authentic Gold / Yellow Twine thread wrapping around cracker
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2.5;
        for (let yOffset = 18; yOffset < h - 10; yOffset += 22) {
          ctx.beginPath();
          ctx.ellipse(cracker.x, top + yOffset, w / 2, 4, 0, 0, Math.PI);
          ctx.stroke();
        }

        // 5. Classic "BIJILI / 28 SPECIAL" Cracker Gold Stamp Label
        ctx.save();
        ctx.translate(cracker.x, cracker.y);
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('★ BIJILI 28 ★', 0, 3);
        ctx.restore();

        ctx.restore();
      }

      // ==========================================
      // UPDATE & DRAW PAPER SHREDS
      // ==========================================
      for (let i = paperShreds.length - 1; i >= 0; i--) {
        const p = paperShreds[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28; // gravity
        p.vx *= 0.96;
        p.rotation += p.rotSpeed;
        p.life -= p.decay;

        // Floor bounce
        if (p.y > canvas.height - 30) {
          p.y = canvas.height - 30;
          p.vy = -p.vy * 0.3;
          p.vx *= 0.7;
        }

        if (p.life <= 0) {
          paperShreds.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }

      // ==========================================
      // UPDATE & DRAW SPARKS
      // ==========================================
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.15;
        s.vx *= 0.97;
        s.life -= s.decay;

        if (s.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 10;
        ctx.globalAlpha = s.life;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // ==========================================
      // UPDATE & DRAW SMOKE
      // ==========================================
      for (let i = smoke.length - 1; i >= 0; i--) {
        const sm = smoke[i];
        sm.x += sm.vx;
        sm.y += sm.vy;
        sm.radius += sm.growth;
        sm.alpha -= sm.decay;

        if (sm.alpha <= 0) {
          smoke.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.fillStyle = `rgba(180, 180, 190, ${sm.alpha * 0.35})`;
        ctx.beginPath();
        ctx.arc(sm.x, sm.y, sm.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // ==========================================
      // DRAW AGARBATTI (BURNING INCENSE STICK) AT CURSOR
      // ==========================================
      if (mouse.x > 0 && mouse.y > 0) {
        ctx.save();
        const stickLength = 110;
        const angle = -Math.PI / 4; // 45 degree angle

        const tipX = mouse.x;
        const tipY = mouse.y;
        const tailX = tipX + Math.cos(angle + Math.PI) * stickLength;
        const tailY = tipY + Math.sin(angle + Math.PI) * stickLength;

        // Stick Wood Body
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Dark Incense coating
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 5.5;
        ctx.beginPath();
        ctx.moveTo(tailX + (tipX - tailX) * 0.25, tailY + (tipY - tailY) * 0.25);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Red/Orange Glowing Ember Tip
        ctx.shadowColor = '#ff3300';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#ff3300';
        ctx.beginPath();
        ctx.arc(tipX, tipY, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // White hot center
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(tipX, tipY, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Continuous thin wisp of aromatic smoke from Agarbatti tip
        if (Math.random() < 0.4) {
          smoke.push({
            x: tipX,
            y: tipY,
            vx: (Math.random() - 0.5) * 0.8,
            vy: -Math.random() * 1.5 - 0.8,
            radius: Math.random() * 5 + 3,
            alpha: 0.45,
            growth: 0.2,
            decay: 0.015
          });
        }

        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    // UI Buttons
    document.getElementById('new-cracker-btn').addEventListener('click', () => {
      initAudio();
      resetCracker();
    });

    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.innerText = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: MUTED';
      soundBtn.style.borderColor = soundEnabled ? '#ff9900' : '#666';
    });

    loop();
  </script>
</body>
</html>
