<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🪔 DIWALI CRACKERS ARCADE // All Crackers Simulator ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #03040b;
      color: #ffd700;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #stage-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
    }
    /* Header HUD */
    #top-hud {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }
    h1 {
      font-size: clamp(20px, 3.8vw, 36px);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffe066, #ff8c00, #ff0055, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
    }
    #hint-bar {
      font-size: clamp(12px, 1.8vw, 15px);
      color: #fff2a3;
      margin-top: 4px;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
      background: rgba(10, 5, 20, 0.6);
      display: inline-block;
      padding: 4px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 153, 0, 0.3);
    }
    /* Top Buttons */
    #top-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 30;
      display: flex;
      gap: 10px;
    }
    .hud-btn {
      background: rgba(18, 10, 35, 0.85);
      border: 1.5px solid #ff9900;
      color: #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.3);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    .hud-btn:hover, .hud-btn.active {
      background: linear-gradient(135deg, #ff9900, #ff0055);
      color: #ffffff;
      transform: scale(1.05);
    }
    /* Cracker Dock */
    #cracker-dock {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(12, 6, 28, 0.92);
      border: 2px solid #ff9900;
      border-radius: 50px;
      padding: 8px 16px;
      display: flex;
      gap: 10px;
      box-shadow: 0 0 30px rgba(255, 153, 0, 0.4);
      backdrop-filter: blur(12px);
      max-width: 96vw;
      overflow-x: auto;
    }
    .dock-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 153, 0, 0.3);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .dock-btn span {
      font-size: 18px;
    }
    .dock-btn:hover {
      background: rgba(255, 153, 0, 0.25);
      border-color: #ffd700;
    }
    .dock-btn.active {
      background: linear-gradient(135deg, #ff8c00, #ff0055);
      border-color: #ffe066;
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.8);
      transform: translateY(-3px) scale(1.04);
    }
    #flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.08s ease-out;
    }
  </style>
</head>
<body>

  <div id="flash"></div>

  <div id="stage-container">
    <div id="top-hud">
      <h1>🪔 HAPPY DIWALI 🪔</h1>
      <div id="hint-bar">🧨 Click on the ground or sky to burst crackers!</div>
    </div>

    <div id="top-controls">
      <button class="hud-btn" id="clear-btn">🧹 Clear Ground</button>
      <button class="hud-btn" id="sound-btn">🔊 Sound: ON</button>
    </div>

    <!-- Cracker Selector Dock -->
    <div id="cracker-dock">
      <button class="dock-btn active" data-type="bijili"><span>🧨</span> Red Bijili</button>
      <button class="dock-btn" data-type="flowerpot"><span>🌺</span> Anar (Flowerpot)</button>
      <button class="dock-btn" data-type="chakra"><span>🌀</span> Ground Chakra</button>
      <button class="dock-btn" data-type="rocket"><span>🚀</span> Sky Rocket</button>
      <button class="dock-btn" data-type="bomb"><span>💣</span> Atom Bomb</button>
      <button class="dock-btn" data-type="sparkler"><span>✨</span> Sparkler</button>
    </div>

    <canvas id="mainCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('flash');
    const hintEl = document.getElementById('hint-bar');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio Synthesizer (Zero Lag, Works on all devices)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'whistle') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(1700, now + 0.55);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);
      }
      else if (type === 'snap') {
        // Sharp Bijili / Cracker Crack
        const snapBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
        const data = snapBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const source = audioCtx.createBufferSource();
        source.buffer = snapBuf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1800, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(now);
      }
      else if (type === 'boom') {
        // Deep sub-bass explosion
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.45);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      }
      else if (type === 'hiss') {
        const bufferSize = audioCtx.sampleRate * 0.25;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(3200, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      }
      else if (type === 'crackle') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(Math.random() * 900 + 400, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
        osc.start(now);
        osc.stop(now + 0.04);
      }
    }

    function screenFlash(opacity = 0.4) {
      flashEl.style.opacity = opacity;
      setTimeout(() => { flashEl.style.opacity = '0'; }, 80);
    }

    // Entities Arrays
    let rockets = [];
    let groundCrackers = [];
    let particles = [];
    let paperShreds = [];
    let scorchMarks = [];

    // Background Stars
    const stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * (window.innerHeight * 0.65),
        size: Math.random() * 1.8 + 0.5,
        alpha: Math.random() * 0.6 + 0.3
      });
    }

    // Particles Class
    class Particle {
      constructor(x, y, color, vx, vy, life = 1, size = 3, gravity = 0.08, friction = 0.97) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
        this.alpha = life;
        this.decay = Math.random() * 0.025 + 0.015;
        this.size = size;
        this.gravity = gravity;
        this.friction = friction;
      }
      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        this.size = Math.max(0.2, this.size * 0.98);
        return this.alpha > 0;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ==========================================
    // 1. BIJILI CRACKER (PROMINENT ON GROUND)
    // ==========================================
    class BijiliCracker {
      constructor(x, y) {
        this.x = x;
        this.y = Math.max(canvas.height * 0.65, Math.min(canvas.height - 85, y));
        this.fuse = 45; // frames to ignite (~1 sec)
        this.state = 'burning';
        playSound('hiss');
      }
      update() {
        if (this.state === 'burning') {
          this.fuse--;
          // Fuse spark
          for (let i = 0; i < 2; i++) {
            particles.push(new Particle(
              this.x, this.y - 48 + (45 - this.fuse) * 0.8, '#ff9900',
              (Math.random() - 0.5) * 3, -Math.random() * 3, 0.4, 2
            ));
          }
          if (Math.random() < 0.25) playSound('crackle');

          if (this.fuse <= 0) {
            this.explode();
            return false;
          }
        }
        return true;
      }
      explode() {
        playSound('snap');
        playSound('boom');
        screenFlash(0.5);
        scorchMarks.push({ x: this.x, y: this.y + 10, radius: 45 });

        // Red & Gold Paper Shreds flying out
        for (let i = 0; i < 40; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 12 + 3;
          paperShreds.push({
            x: this.x,
            y: this.y - 15,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            color: Math.random() > 0.3 ? '#ff2222' : '#ffd700',
            size: Math.random() * 8 + 4,
            rotation: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.4,
            alpha: 1
          });
        }

        // Sparks
        for (let i = 0; i < 50; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 14 + 2;
          particles.push(new Particle(
            this.x, this.y - 15, Math.random() > 0.4 ? '#ffcc00' : '#ffffff',
            Math.cos(angle) * speed, Math.sin(angle) * speed, 1, 3, 0.1
          ));
        }
      }
      draw() {
        ctx.save();
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 22, 20, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Twisted Fuse
        const fuseTopY = this.y - 20 - (this.fuse / 45) * 26;
        ctx.strokeStyle = '#a68a56';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 20);
        ctx.lineTo(this.x + 4, fuseTopY);
        ctx.stroke();

        // Spark at fuse tip
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ff5500';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(this.x + 4, fuseTopY, 4, 0, Math.PI * 2);
        ctx.fill();

        // Red Bijili Tube
        const grad = ctx.createLinearGradient(this.x - 12, 0, this.x + 12, 0);
        grad.addColorStop(0, '#990000');
        grad.addColorStop(0.4, '#ff2222');
        grad.addColorStop(1, '#660000');
        ctx.fillStyle = grad;
        ctx.fillRect(this.x - 10, this.y - 20, 20, 42);

        // Gold Twine Rings
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x - 10, this.y - 10); ctx.lineTo(this.x + 10, this.y - 10);
        ctx.moveTo(this.x - 10, this.y); ctx.lineTo(this.x + 10, this.y);
        ctx.moveTo(this.x - 10, this.y + 10); ctx.lineTo(this.x + 10, this.y + 10);
        ctx.stroke();

        ctx.restore();
      }
    }

    // ==========================================
    // 2. FLOWERPOT / ANAR
    // ==========================================
    class Flowerpot {
      constructor(x, y) {
        this.x = x;
        this.y = Math.max(canvas.height * 0.65, Math.min(canvas.height - 80, y));
        this.duration = 180;
        this.timer = 0;
        playSound('hiss');
      }
      update() {
        this.timer++;
        const intensity = Math.sin((this.timer / this.duration) * Math.PI);
        const count = Math.floor(intensity * 15 + 3);

        for (let i = 0; i < count; i++) {
          const speed = Math.random() * 12 + 6;
          const spread = (Math.random() - 0.5) * 0.55;
          particles.push(new Particle(
            this.x + (Math.random() * 8 - 4), this.y - 18, Math.random() > 0.3 ? '#ffd700' : '#ffffff',
            Math.sin(spread) * speed, -Math.cos(spread) * speed,
            0.9, Math.random() * 3 + 1.5, 0.18, 0.97
          ));
        }
        if (Math.random() < 0.2) playSound('crackle');
        return this.timer < this.duration;
      }
      draw() {
        ctx.save();
        // Cone
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 18);
        ctx.lineTo(this.x - 18, this.y + 12);
        ctx.lineTo(this.x + 18, this.y + 12);
        ctx.closePath();
        ctx.fill();
        // Gold Base
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(this.x - 18, this.y + 8, 36, 5);
        ctx.restore();
      }
    }

    // ==========================================
    // 3. GROUND CHAKRA (CHAKKARI)
    // ==========================================
    class Chakra {
      constructor(x, y) {
        this.x = x;
        this.y = Math.max(canvas.height * 0.65, Math.min(canvas.height - 80, y));
        this.angle = 0;
        this.duration = 200;
        this.timer = 0;
        playSound('hiss');
      }
      update() {
        this.timer++;
        this.angle += 0.38;
        const color = ['#ff0055', '#00ffff', '#ffd700', '#00ff66'][Math.floor(this.timer / 15) % 4];

        for (let i = 0; i < 4; i++) {
          const dir = this.angle + (i * Math.PI / 2);
          const speed = Math.random() * 7 + 4;
          particles.push(new Particle(
            this.x, this.y, color,
            Math.cos(dir) * speed, Math.sin(dir) * speed * 0.35,
            0.8, Math.random() * 2.5 + 1.5, 0.07, 0.96
          ));
        }
        if (Math.random() < 0.15) playSound('crackle');
        return this.timer < this.duration;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(-18, -4, 36, 8);
        ctx.restore();
      }
    }

    // ==========================================
    // 4. SKY ROCKET
    // ==========================================
    class Rocket {
      constructor(targetX, targetY) {
        this.x = targetX;
        this.y = canvas.height;
        this.targetY = Math.min(targetY, canvas.height * 0.5);
        this.speed = Math.random() * 3 + 12;
        this.color = ['#ff0055', '#ff9900', '#00ffff', '#00ff66', '#ffd700', '#bf00ff'][Math.floor(Math.random() * 6)];
        playSound('whistle');
      }
      update() {
        this.y -= this.speed;
        // Trail
        particles.push(new Particle(
          this.x, this.y + 10, '#ff9900',
          (Math.random() - 0.5) * 1.5, Math.random() * 2, 0.4, 2
        ));
        if (this.y <= this.targetY) {
          this.explode();
          return false;
        }
        return true;
      }
      explode() {
        playSound('boom');
        screenFlash(0.35);
        for (let i = 0; i < 85; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 8 + 2;
          particles.push(new Particle(
            this.x, this.y, this.color,
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            1, Math.random() * 3 + 2, 0.06, 0.96
          ));
        }
      }
      draw() {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ==========================================
    // 5. ATOM BOMB
    // ==========================================
    class AtomBomb {
      constructor(x, y) {
        this.x = x;
        this.y = Math.max(canvas.height * 0.65, Math.min(canvas.height - 80, y));
        this.fuse = 55;
        playSound('hiss');
      }
      update() {
        this.fuse--;
        particles.push(new Particle(
          this.x, this.y - 20, '#ff9900',
          (Math.random() - 0.5) * 2, -Math.random() * 2, 0.4, 2
        ));
        if (this.fuse <= 0) {
          playSound('boom');
          playSound('snap');
          screenFlash(0.7);
          scorchMarks.push({ x: this.x, y: this.y + 10, radius: 70 });
          for (let i = 0; i < 110; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 14 + 3;
            particles.push(new Particle(
              this.x, this.y, ['#ff0055', '#ffd700', '#ff9900', '#00ffff'][Math.floor(Math.random() * 4)],
              Math.cos(angle) * speed, Math.sin(angle) * speed - 2, 1.2, Math.random() * 4 + 2, 0.1
            ));
          }
          return false;
        }
        return true;
      }
      draw() {
        ctx.save();
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(this.x - 16, this.y - 16, 32, 28);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(this.x - 10, this.y - 12, 20, 6);
        ctx.restore();
      }
    }

    // Cracker Selection State
    let currentType = 'bijili';
    const dockButtons = document.querySelectorAll('.dock-btn');
    dockButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        initAudio();
        dockButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.getAttribute('data-type');
        updateHint();
      });
    });

    function updateHint() {
      if (currentType === 'bijili') hintEl.innerText = '🧨 Click ground to place & light a Red Bijili cracker!';
      else if (currentType === 'flowerpot') hintEl.innerText = '🌺 Click ground to light a glowing Anar Flowerpot!';
      else if (currentType === 'chakra') hintEl.innerText = '🌀 Click ground to spin a glowing Ground Chakra!';
      else if (currentType === 'rocket') hintEl.innerText = '🚀 Click anywhere in the sky to launch Sky Rockets!';
      else if (currentType === 'bomb') hintEl.innerText = '💣 Click ground to place a heavy Atom Bomb!';
      else if (currentType === 'sparkler') hintEl.innerText = '✨ Drag mouse or finger to make sparkling lights!';
    }
    updateHint();

    // Trigger on Canvas Click
    canvas.addEventListener('click', (e) => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (currentType === 'bijili') {
        groundCrackers.push(new BijiliCracker(x, y));
      } else if (currentType === 'flowerpot') {
        groundCrackers.push(new Flowerpot(x, y));
      } else if (currentType === 'chakra') {
        groundCrackers.push(new Chakra(x, y));
      } else if (currentType === 'rocket') {
        rockets.push(new Rocket(x, y));
      } else if (currentType === 'bomb') {
        groundCrackers.push(new AtomBomb(x, y));
      } else if (currentType === 'sparkler') {
        makeSparkler(x, y);
      }
    });

    // Sparkler Dragging
    let isDragging = false;
    canvas.addEventListener('mousedown', () => { isDragging = true; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging && currentType === 'sparkler') {
        makeSparkler(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      if (currentType === 'sparkler') {
        const touch = e.touches[0];
        makeSparkler(touch.clientX, touch.clientY);
      }
    }, { passive: true });

    function makeSparkler(x, y) {
      initAudio();
      for (let i = 0; i < 7; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push(new Particle(
          x, y, '#ffd700',
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          0.6, Math.random() * 2.5 + 1, 0.05
        ));
      }
      if (Math.random() < 0.25) playSound('crackle');
    }

    // Clear Button
    document.getElementById('clear-btn').addEventListener('click', () => {
      initAudio();
      groundCrackers = [];
      paperShreds = [];
      scorchMarks = [];
      particles = [];
      rockets = [];
    });

    // Sound Button
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.innerText = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: MUTED';
    });

    // Main Render Loop
    function loop() {
      // Semi-clear for particle trails
      ctx.fillStyle = 'rgba(3, 4, 11, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sky Stars
      ctx.fillStyle = '#ffffff';
      for (let s of stars) {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
      ctx.globalAlpha = 1;

      // PROMINENT VISIBLE GROUND / TERRACE (Starts at 60% height)
      const groundY = canvas.height * 0.60;
      const gGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
      gGrad.addColorStop(0, '#1c1230');
      gGrad.addColorStop(0.3, '#140c24');
      gGrad.addColorStop(1, '#090512');
      ctx.fillStyle = gGrad;
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // Glowing Ground Border Line
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#ff8800';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Ground Perspective Grid Tiles
      ctx.strokeStyle = '#271745';
      ctx.lineWidth = 1.5;
      for (let x = -100; x < canvas.width + 300; x += 110) {
        ctx.beginPath();
        ctx.moveTo(x, groundY);
        ctx.lineTo(x + (x - canvas.width / 2) * 1.2, canvas.height);
        ctx.stroke();
      }

      // Draw Burnt Scorch Marks on Ground
      for (let sm of scorchMarks) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.beginPath();
        ctx.ellipse(sm.x, sm.y, sm.radius, sm.radius * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Paper Shreds Update & Draw
      for (let i = paperShreds.length - 1; i >= 0; i--) {
        const p = paperShreds[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28;
        p.vx *= 0.96;
        p.rotation += p.rotSpeed;
        p.alpha -= 0.008;

        if (p.y > canvas.height - 70) {
          p.y = canvas.height - 70;
          p.vy = -p.vy * 0.2;
          p.vx *= 0.6;
        }

        if (p.alpha <= 0) {
          paperShreds.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }

      // Ground Crackers (Bijili, Anar, Chakra, Bomb)
      for (let i = groundCrackers.length - 1; i >= 0; i--) {
        if (!groundCrackers[i].update()) {
          groundCrackers.splice(i, 1);
        } else {
          groundCrackers[i].draw();
        }
      }

      // Sky Rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        if (!rockets[i].update()) {
          rockets.splice(i, 1);
        } else {
          rockets[i].draw();
        }
      }

      // Sparks & Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        if (!particles[i].update()) {
          particles.splice(i, 1);
        } else {
          particles[i].draw();
        }
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
