<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="100%" height="100%">
  <defs>
    <!-- Sky / Space Void Background -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05010d" />
      <stop offset="50%" stop-color="#140428" />
      <stop offset="100%" stop-color="#080214" />
    </linearGradient>

    <!-- Boost Flame Gradient -->
    <linearGradient id="thrustFlame" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gengar Purple Body Gradient -->
    <linearGradient id="gengarSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <radialGradient id="energyCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00ffff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="boostGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .sky-canvas {
        cursor: pointer;
      }

      /* Background Anime Speed Lines */
      .speed-line {
        stroke: #c084fc;
        stroke-width: 1.5;
        stroke-linecap: round;
        animation: streamSpeed 0.8s linear infinite;
      }
      .line-fast { stroke: #00f0ff; stroke-width: 2; animation-duration: 0.5s; }
      .line-slow { stroke: #581c87; stroke-width: 1; animation-duration: 1.2s; }

      @keyframes streamSpeed {
        0% { transform: translateX(450px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateX(-450px); opacity: 0; }
      }

      /* Flying Gengar Flight & Swoop Motion */
      .flying-gengar {
        transform-origin: center;
        animation: flyPatrol 5s ease-in-out infinite;
        transition: transform 0.4s ease;
      }

      @keyframes flyPatrol {
        0% { transform: translate(120px, 125px) rotate(-6deg); }
        25% { transform: translate(280px, 95px) rotate(4deg); }
        50% { transform: translate(460px, 135px) rotate(-4deg); }
        75% { transform: translate(320px, 110px) rotate(5deg); }
        100% { transform: translate(120px, 125px) rotate(-6deg); }
      }

      /* Boost Exhaust Fire Flaring */
      .thrust-stream {
        transform-origin: right center;
        animation: flamePuff 0.3s ease-in-out infinite alternate;
      }

      @keyframes flamePuff {
        0% { transform: scaleX(0.85) scaleY(0.9); opacity: 0.75; }
        100% { transform: scaleX(1.2) scaleY(1.1); opacity: 1; }
      }

      /* Sonic Energy Rings Bursting Behind */
      .sonic-ring {
        animation: sonicBlast 1.5s linear infinite;
        transform-origin: 300px 125px;
      }
      .sonic-ring-2 { animation-delay: 0.75s; }

      @keyframes sonicBlast {
        0% { transform: scale(0.3); opacity: 0.9; stroke: #00ffff; }
        100% { transform: scale(2.2); opacity: 0; stroke: #ff007f; }
      }

      /* Power Sparks Orbiting */
      .power-orb {
        animation: spinPower 2s linear infinite;
        transform-origin: 52px 0px;
      }

      @keyframes spinPower {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* ========================================================
         MOUSE HOVER: TURBO SHADOW BOOST!
         ======================================================== */
      .sky-canvas:hover .flying-gengar {
        animation: hyperBoost 1.8s ease-in-out infinite alternate;
      }

      @keyframes hyperBoost {
        0% { transform: translate(180px, 100px) scale(1.15) rotate(8deg); }
        100% { transform: translate(480px, 100px) scale(1.25) rotate(-5deg); }
      }

      .sky-canvas:hover .speed-line {
        animation-duration: 0.3s;
        stroke: #00ffff;
        stroke-width: 2.5;
      }

      .sky-canvas:hover .thrust-stream {
        transform: scaleX(1.8) scaleY(1.3);
        filter: drop-shadow(0 0 20px #00ffff);
      }

      .sky-canvas:hover .hud-title {
        fill: #00ffff;
        letter-spacing: 5px;
      }

      .hud-title {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #c084fc;
        transition: all 0.4s ease;
      }
    </style>
  </defs>

  <!-- Cosmic Sky Frame -->
  <rect width="100%" height="100%" fill="url(#nightSky)" rx="16" stroke="#4c1d95" stroke-width="2"/>

  <!-- Speed Lines Streaming Across Space -->
  <g>
    <line class="speed-line" x1="200" y1="40" x2="340" y2="40" style="animation-delay: 0.1s;"/>
    <line class="speed-line line-fast" x1="400" y1="70" x2="580" y2="70" style="animation-delay: 0.4s;"/>
    <line class="speed-line line-slow" x1="150" y1="95" x2="280" y2="95" style="animation-delay: 0.7s;"/>
    <line class="speed-line" x1="500" y1="120" x2="650" y2="120" style="animation-delay: 0.2s;"/>
    <line class="speed-line line-fast" x1="250" y1="150" x2="430" y2="150" style="animation-delay: 0.5s;"/>
    <line class="speed-line" x1="600" y1="180" x2="740" y2="180" style="animation-delay: 0.8s;"/>
    <line class="speed-line line-slow" x1="120" y1="210" x2="300" y2="210" style="animation-delay: 0.3s;"/>
    <line class="speed-line line-fast" x1="380" y1="230" x2="550" y2="230" style="animation-delay: 0.6s;"/>
  </g>

  <!-- Interactive Canvas -->
  <g class="sky-canvas">

    <!-- Title and Power Indicator -->
    <text class="hud-title" x="420" y="32" font-size="12" text-anchor="middle">⚡ POKÉMON POWER SURGE // SHADOW FLIGHT ⚡</text>
    <text font-family="Courier New, monospace" x="420" y="235" font-size="10" fill="#a855f7" text-anchor="middle">► HOVER MOUSE TO ENGAGE TURBO BOOST ACCELERATION ◄</text>

    <!-- Flying Pokémon Group (Animated Flight Path) -->
    <g class="flying-gengar">

      <!-- Ghost / Plasma Thrust Booster Trails (Shooting from behind Gengar) -->
      <g class="thrust-stream" transform="translate(-140, -12)">
        <!-- Massive Plasma Exhaust Trail -->
        <polygon points="140,-5 0,-25 -80,0 0,25 140,5" fill="url(#thrustFlame)" filter="url(#boostGlow)"/>
        <!-- Core Blue Shock Jet -->
        <polygon points="140,-2 40,-12 0,0 40,12 140,2" fill="#00ffff" filter="url(#boostGlow)"/>

        <!-- Spark Particles Flying Back -->
        <circle cx="-40" cy="-14" r="3" fill="#ff007f"/>
        <circle cx="-70" cy="8" r="2.5" fill="#00ffff"/>
        <circle cx="-20" cy="18" r="3.5" fill="#ffe600"/>
      </g>

      <!-- Gengar Shadow Body (Sleek Flying Angle) -->
      <g filter="url(#boostGlow)">
        <!-- Back Horns / Spikes swept back from speed -->
        <polygon points="-8,-48 -28,-72 8,-42" fill="#581c87" stroke="#2e1065" stroke-width="2"/>
        <polygon points="40,-48 60,-75 25,-40" fill="#581c87" stroke="#2e1065" stroke-width="2"/>
        <polygon points="12,-48 20,-68 28,-48" fill="#581c87"/>

        <!-- Main Body Hull (Egg Shape Angled Forward) -->
        <ellipse cx="20" cy="0" rx="46" ry="42" fill="url(#gengarSkin)" stroke="#2e1065" stroke-width="3"/>

        <!-- Extended Flying Arms (Superman Flight Stance) -->
        <!-- Front Leading Arm with Shadow Spark -->
        <path d="M 52 -6 C 75 -12, 90 2, 85 14 C 75 16, 52 10, 52 2 Z" fill="url(#gengarSkin)" stroke="#2e1065" stroke-width="2"/>
        <circle cx="88" cy="8" r="3" fill="#ffffff"/>

        <!-- Trailing Rear Arm -->
        <path d="M -16 6 C -32 18, -42 12, -35 2 C -28 -6, -16 0, -16 6 Z" fill="#4c1d95"/>

        <!-- Tucked Back Feet (Aerodynamic) -->
        <ellipse cx="-20" cy="28" rx="14" ry="9" fill="#3b0764"/>
        <ellipse cx="6" cy="34" rx="15" ry="9" fill="#3b0764"/>

        <!-- Menacing Red Glowing Eyes (Angled forward into flight) -->
        <path d="M 32 -16 Q 46 -24 56 -14 Q 44 -8 32 -16 Z" fill="#ff0055" filter="url(#boostGlow)"/>
        <circle cx="48" cy="-15" r="2.5" fill="#ffffff"/>

        <path d="M 12 -18 Q 22 -25 28 -16 Q 20 -10 12 -18 Z" fill="#ff0055" filter="url(#boostGlow)"/>
        <circle cx="22" cy="-17" r="2" fill="#ffffff"/>

        <!-- Fiendish Grin with Teeth -->
        <path d="M 22 8 Q 50 28 66 8 Q 48 15 22 8 Z" fill="#1e0538" stroke="#2e1065" stroke-width="2"/>
        <path d="M 28 9 L 33 16 L 39 10 L 45 18 L 52 10 L 58 16 L 63 9" stroke="#ffffff" stroke-width="2" fill="none"/>
      </g>

      <!-- Charging Front Energy Plasma Orb (In front of Gengar's outstretched hand) -->
      <g transform="translate(90, 8)">
        <circle cx="0" cy="0" r="18" fill="url(#energyCore)" filter="url(#boostGlow)"/>
        <circle class="power-orb" cx="0" cy="0" r="4" fill="#00ffff"/>
        <!-- Electric Arcs -->
        <path d="M -6 -8 L 0 -14 L 8 -6 M -8 6 L -2 12 L 6 8" stroke="#00ffff" stroke-width="1.5" fill="none"/>
      </g>

    </g>

  </g>
</svg>