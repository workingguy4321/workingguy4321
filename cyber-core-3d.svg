<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0055ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .cyber-container {
        cursor: pointer;
      }

      /* 3D Core Shield Continuous Idle Rotation */
      .shield-3d-group {
        transform-origin: 400px 160px;
        animation: floatIdle 4s ease-in-out infinite alternate;
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes floatIdle {
        0% { transform: translateY(-6px) rotateZ(-1deg); }
        100% { transform: translateY(6px) rotateZ(1deg); }
      }

      /* Outer Radar Orbital Rings */
      .orbit-ring-1 {
        transform-origin: 400px 160px;
        animation: spinClockwise 12s linear infinite;
        transition: stroke-dasharray 0.5s ease;
      }

      .orbit-ring-2 {
        transform-origin: 400px 160px;
        animation: spinCounter 8s linear infinite;
      }

      .orbit-ring-3 {
        transform-origin: 400px 160px;
        animation: spinClockwise 20s linear infinite;
      }

      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      /* Hexagon Core Pulse */
      .hex-core {
        transform-origin: 400px 160px;
        animation: pulseCore 2.5s ease-in-out infinite;
        transition: all 0.5s ease;
      }

      @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      /* Target Reticle Crosshairs */
      .crosshair {
        stroke: #00f0ff;
        stroke-width: 1.5;
        opacity: 0.4;
        transition: opacity 0.4s ease;
      }

      /* ========================================================
         MOUSE HOVER 3D REACTION - THIS TRIGGERS ON CURSOR PASS
         ======================================================== */
      .cyber-container:hover .shield-3d-group {
        transform: scale(1.18) rotateY(180deg) rotateZ(10deg);
        filter: drop-shadow(0 0 25px #00f0ff);
      }

      .cyber-container:hover .orbit-ring-1 {
        animation-duration: 2s;
        stroke: #ff007f;
      }

      .cyber-container:hover .orbit-ring-2 {
        animation-duration: 1.5s;
        stroke: #00ffcc;
      }

      .cyber-container:hover .orbit-ring-3 {
        animation-duration: 3s;
        stroke: #ffe600;
      }

      .cyber-container:hover .hex-core {
        fill: url(#cyberGrad);
        transform: scale(1.22);
        filter: drop-shadow(0 0 30px #ff007f);
      }

      .cyber-container:hover .crosshair {
        opacity: 1;
        stroke: #ff007f;
      }

      .cyber-container:hover .hud-title {
        fill: #00ffcc;
        letter-spacing: 6px;
      }

      .cyber-container:hover .hud-sub {
        fill: #ff007f;
      }

      .hud-title {
        font-family: 'Courier New', 'Share Tech Mono', monospace, sans-serif;
        font-weight: 900;
        letter-spacing: 4px;
        fill: #00f0ff;
        transition: all 0.5s ease;
      }

      .hud-sub {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
        letter-spacing: 2px;
        fill: #94a3b8;
        transition: all 0.5s ease;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#050a14" rx="16" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Tech Grid Lines -->
  <g opacity="0.15">
    <line x1="0" y1="80" x2="800" y2="80" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <g class="cyber-container">
    <!-- Target Reticle & Crosshairs -->
    <line class="crosshair" x1="400" y1="40" x2="400" y2="280" stroke-dasharray="8 4"/>
    <line class="crosshair" x1="260" y1="160" x2="540" y2="160" stroke-dasharray="8 4"/>

    <!-- Orbital Gyroscope Rings (3D Depth) -->
    <!-- Outer Ring 3 -->
    <circle class="orbit-ring-3" cx="400" cy="160" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="40 15 10 15"/>

    <!-- Middle Ring 2 (Dashed Cyan) -->
    <ellipse class="orbit-ring-2" cx="400" cy="160" rx="95" ry="95" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="25 20 8 20" opacity="0.8" filter="url(#coreGlow)"/>

    <!-- Inner Ring 1 (Magenta / Violet) -->
    <ellipse class="orbit-ring-1" cx="400" cy="160" rx="78" ry="78" fill="none" stroke="#7000ff" stroke-width="2.5" stroke-dasharray="60 15 30 15" opacity="0.9"/>

    <!-- Floating 3D Core Shield Unit -->
    <g class="shield-3d-group">
      <!-- Outer Hexagonal Frame -->
      <polygon class="hex-core" points="400,105 448,132 448,188 400,215 352,188 352,132" fill="url(#shieldGrad)" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>

      <!-- Inner Rotating Wireframe Prism -->
      <polygon points="400,118 436,138 436,182 400,202 364,182 364,138" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>

      <!-- Central Shield Crest / Antivirus Heart -->
      <path d="M 400 135 L 422 145 L 422 165 C 422 180 400 190 400 190 C 400 190 378 180 378 165 L 378 145 Z" fill="#00ffcc" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)"/>

      <!-- Core Symbol (Lock / Crosshair) -->
      <circle cx="400" cy="160" r="4" fill="#050a14"/>
      <line x1="400" y1="150" x2="400" y2="170" stroke="#050a14" stroke-width="2"/>
      <line x1="390" y1="160" x2="410" y2="160" stroke="#050a14" stroke-width="2"/>
    </g>

    <!-- Interactive HUD Labels -->
    <text class="hud-title" x="400" y="45" text-anchor="middle" font-size="16">❖ WINDOWS ANTIVIRUS // 3D CORE ENGINE ❖</text>
    <text class="hud-sub" x="400" y="295" text-anchor="middle" font-size="13">⚡ HOVER MOUSE TO ENGAGE 3D QUANTUM SPIN ⚡</text>

    <!-- Side Status Telemetry -->
    <g font-family="Courier New, monospace" font-size="11" fill="#00f0ff" opacity="0.8">
      <text x="35" y="145">DEFENSE: ACTIVE</text>
      <text x="35" y="165">HEURISTIC: ON</text>
      <text x="35" y="185">CORE: QUANTUM</text>

      <text x="765" y="145" text-anchor="end">SYS: WIN x64</text>
      <text x="765" y="165" text-anchor="end">THREATS: 0</text>
      <text x="765" y="185" text-anchor="end">STATUS: READY</text>
    </g>
  </g>
</svg>