<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.9" />
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .matrix-container {
        cursor: pointer;
      }

      /* 3D Isometric Cube Floating Animation */
      .cube-3d-group {
        transform-origin: 400px 160px;
        animation: floatIdle 3.5s ease-in-out infinite alternate;
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes floatIdle {
        0% { transform: translateY(-8px) rotateX(15deg) rotateY(-15deg); }
        100% { transform: translateY(8px) rotateX(-15deg) rotateY(15deg); }
      }

      /* Orbital Rings */
      .orbit-ring-1 {
        transform-origin: 400px 160px;
        animation: spinClockwise 14s linear infinite;
      }

      .orbit-ring-2 {
        transform-origin: 400px 160px;
        animation: spinCounter 9s linear infinite;
      }

      .orbit-ring-3 {
        transform-origin: 400px 160px;
        animation: spinClockwise 22s linear infinite;
      }

      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      /* MOUSE HOVER 3D ROTATION */
      .matrix-container:hover .cube-3d-group {
        transform: scale(1.25) rotateX(180deg) rotateZ(45deg);
        filter: drop-shadow(0 0 30px #38bdf8);
      }

      .matrix-container:hover .orbit-ring-1 {
        animation-duration: 2.5s;
        stroke: #ec4899;
      }

      .matrix-container:hover .orbit-ring-2 {
        animation-duration: 1.8s;
        stroke: #06b6d4;
      }

      .matrix-container:hover .orbit-ring-3 {
        animation-duration: 3s;
        stroke: #a855f7;
      }

      .matrix-container:hover .hud-title {
        fill: #38bdf8;
        letter-spacing: 6px;
      }

      .hud-title {
        font-family: 'Segoe UI', Inter, sans-serif;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #f1f5f9;
        transition: all 0.5s ease;
      }

      .hud-sub {
        font-family: 'Segoe UI', Inter, sans-serif;
        font-weight: 600;
        letter-spacing: 2px;
        fill: #64748b;
        transition: all 0.5s ease;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" stroke="#1e293b" stroke-width="2"/>

  <!-- Tech Grid Background -->
  <g opacity="0.12">
    <line x1="0" y1="80" x2="800" y2="80" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <g class="matrix-container">
    <!-- Gyroscope Rings -->
    <circle class="orbit-ring-3" cx="400" cy="160" r="115" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="30 15 10 15"/>
    <ellipse class="orbit-ring-2" cx="400" cy="160" rx="98" ry="98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="20 15 5 15" opacity="0.8" filter="url(#neonGlow)"/>
    <ellipse class="orbit-ring-1" cx="400" cy="160" rx="80" ry="80" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="50 15 25 15" opacity="0.9"/>

    <!-- 3D Geometric Hypercube -->
    <g class="cube-3d-group">
      <!-- Top Face -->
      <polygon points="400,105 450,130 400,155 350,130" fill="url(#prismGrad)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
      <!-- Left Face -->
      <polygon points="350,130 400,155 400,215 350,190" fill="url(#cubeGrad)" stroke="#ffffff" stroke-width="1.5" opacity="0.85"/>
      <!-- Right Face -->
      <polygon points="400,155 450,130 450,190 400,215" fill="#1e1b4b" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
      <!-- Inner Glowing Core Point -->
      <circle cx="400" cy="160" r="6" fill="#38bdf8" filter="url(#neonGlow)"/>
    </g>

    <!-- Header Text -->
    <text class="hud-title" x="400" y="45" text-anchor="middle" font-size="16">❖ SYSTEMS ARCHITECTURE &amp; FULL-STACK LAB ❖</text>
    <text class="hud-sub" x="400" y="295" text-anchor="middle" font-size="13">⚡ HOVER MOUSE TO ROTATE 3D ENGINE ⚡</text>

    <!-- Side Metrics -->
    <g font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#38bdf8" opacity="0.85">
      <text x="35" y="145">SYSTEM: WIN x64</text>
      <text x="35" y="165">ENGINE: C++ / PYTHON</text>
      <text x="35" y="185">STACK: FULL-STACK</text>

      <text x="765" y="145" text-anchor="end">STATUS: ACTIVE</text>
      <text x="765" y="165" text-anchor="end">OPTIMIZATION: MAX</text>
      <text x="765" y="185" text-anchor="end">PIPELINE: LIVE</text>
    </g>
  </g>
</svg>