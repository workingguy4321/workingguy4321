<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- Dark Grid Board Background -->
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02050c" />
    </linearGradient>

    <!-- Glowing Food Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .snake-board {
        cursor: crosshair;
      }

      /* Snake Head Crawl Animation */
      .snake-head-crawl {
        transform-origin: 260px 180px;
        animation: snakeSlither 2s ease-in-out infinite alternate;
        transition: transform 0.3s ease;
      }
      @keyframes snakeSlither {
        0% { transform: translateX(-4px) translateY(2px); }
        100% { transform: translateX(6px) translateY(-2px); }
      }

      /* Food Apples Hover Reactions */
      .food-target {
        cursor: pointer;
        transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .food-apple-1 { transform-origin: 460px 180px; animation: pulseApple 1.4s ease-in-out infinite alternate; }
      .food-apple-2 { transform-origin: 320px 100px; animation: pulseApple 1.4s ease-in-out infinite alternate 0.4s; }
      .food-apple-3 { transform-origin: 600px 120px; animation: pulseApple 1.4s ease-in-out infinite alternate 0.8s; }
      .food-apple-4 { transform-origin: 520px 260px; animation: pulseApple 1.4s ease-in-out infinite alternate 0.6s; }

      @keyframes pulseApple {
        0% { transform: scale(0.92); }
        100% { transform: scale(1.12); }
      }

      /* Snake Body Segment Colors */
      .seg-1 { fill: #00ff88; }
      .seg-2 { fill: #00e575; }
      .seg-3 { fill: #00cc66; }
      .seg-4 { fill: #00b359; }
      .seg-5 { fill: #00994c; }

      /* Eaten Score Popup */
      .score-popup {
        opacity: 0;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #ffe600;
        font-weight: bold;
        transition: opacity 0.2s ease, transform 0.3s ease;
      }

      /* ========================================================
         MOUSE HOVER CHOMP REACTIONS (WHEN CURSOR TOUCHES FOOD)
         ======================================================== */
      .food-target-1:hover .apple-shape {
        transform: scale(0);
        opacity: 0;
      }
      .food-target-1:hover .score-popup {
        opacity: 1;
        transform: translateY(-22px);
      }
      .food-target-1:hover ~ .snake-group .snake-head-crawl {
        transform: scale(1.3) translateX(180px);
        filter: drop-shadow(0 0 15px #00ff88);
      }

      .food-target-2:hover .apple-shape {
        transform: scale(0);
        opacity: 0;
      }
      .food-target-2:hover .score-popup {
        opacity: 1;
        transform: translateY(-22px);
      }
      .food-target-2:hover ~ .snake-group .snake-head-crawl {
        transform: scale(1.3) translateX(50px) translateY(-60px);
        filter: drop-shadow(0 0 15px #00ff88);
      }

      .food-target-3:hover .apple-shape {
        transform: scale(0);
        opacity: 0;
      }
      .food-target-3:hover .score-popup {
        opacity: 1;
        transform: translateY(-22px);
      }
      .food-target-3:hover ~ .snake-group .snake-head-crawl {
        transform: scale(1.3) translateX(300px) translateY(-50px);
        filter: drop-shadow(0 0 15px #00ff88);
      }

      .food-target-4:hover .apple-shape {
        transform: scale(0);
        opacity: 0;
      }
      .food-target-4:hover .score-popup {
        opacity: 1;
        transform: translateY(-22px);
      }
      .food-target-4:hover ~ .snake-group .snake-head-crawl {
        transform: scale(1.3) translateX(230px) translateY(70px);
        filter: drop-shadow(0 0 15px #00ff88);
      }

      .retro-text {
        font-family: 'Courier New', monospace;
        font-weight: bold;
      }
    </style>
  </defs>

  <!-- Arcade Board Outer Frame -->
  <rect width="100%" height="100%" fill="url(#boardBg)" rx="16" stroke="#00ff88" stroke-width="2"/>

  <!-- Pixel Grid Pattern -->
  <g opacity="0.08" stroke="#00ff88" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>

    <line x1="40" y1="0" x2="40" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="280" y1="0" x2="280" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="440" y1="0" x2="440" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="520" y1="0" x2="520" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="680" y1="0" x2="680" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="760" y1="0" x2="760" y2="360"/>
  </g>

  <!-- Top Status HUD -->
  <g class="retro-text" font-size="12">
    <text x="30" y="30" fill="#00ff88">SCORE: 1,420</text>
    <text x="400" y="30" text-anchor="middle" fill="#ffe600">★ CYBER SNAKE ARCADE // HOVER TO CHOMP APPLES ★</text>
    <text x="770" y="30" text-anchor="end" fill="#ff0055">LENGTH: 24</text>
  </g>
  <line x1="20" y1="40" x2="780" y2="40" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Interactive Board Elements -->
  <g class="snake-board">

    <!-- FOOD TARGET 1 (DIRECT AHEAD) -->
    <g class="food-target food-target-1 food-apple-1">
      <circle cx="460" cy="180" r="32" fill="transparent"/>
      <g class="apple-shape" style="transition: all 0.25s ease;">
        <circle cx="460" cy="180" r="14" fill="#ff0055" filter="url(#neonGlow)"/>
        <!-- Apple Stem & Leaf -->
        <line x1="460" y1="166" x2="463" y2="158" stroke="#84cc16" stroke-width="2"/>
        <circle cx="465" cy="158" r="3" fill="#84cc16"/>
      </g>
      <text class="score-popup" x="460" y="165" text-anchor="middle">+100 PTS!</text>
    </g>

    <!-- FOOD TARGET 2 (TOP LEFT) -->
    <g class="food-target food-target-2 food-apple-2">
      <circle cx="320" cy="100" r="32" fill="transparent"/>
      <g class="apple-shape" style="transition: all 0.25s ease;">
        <circle cx="320" cy="100" r="14" fill="#00ffff" filter="url(#neonGlow)"/>
        <line x1="320" y1="86" x2="323" y2="78" stroke="#ffe600" stroke-width="2"/>
        <circle cx="325" cy="78" r="3" fill="#ffe600"/>
      </g>
      <text class="score-popup" x="320" y="85" text-anchor="middle">+250 PTS!</text>
    </g>

    <!-- FOOD TARGET 3 (TOP RIGHT) -->
    <g class="food-target food-target-3 food-apple-3">
      <circle cx="600" cy="120" r="32" fill="transparent"/>
      <g class="apple-shape" style="transition: all 0.25s ease;">
        <circle cx="600" cy="120" r="14" fill="#ffe600" filter="url(#neonGlow)"/>
        <line x1="600" y1="106" x2="603" y2="98" stroke="#ff0055" stroke-width="2"/>
        <circle cx="605" cy="98" r="3" fill="#ff0055"/>
      </g>
      <text class="score-popup" x="600" y="105" text-anchor="middle">+500 BONUS!</text>
    </g>

    <!-- FOOD TARGET 4 (BOTTOM RIGHT) -->
    <g class="food-target food-target-4 food-apple-4">
      <circle cx="520" cy="260" r="32" fill="transparent"/>
      <g class="apple-shape" style="transition: all 0.25s ease;">
        <circle cx="520" cy="260" r="14" fill="#a855f7" filter="url(#neonGlow)"/>
        <line x1="520" y1="246" x2="523" y2="238" stroke="#00ffff" stroke-width="2"/>
        <circle cx="525" cy="238" r="3" fill="#00ffff"/>
      </g>
      <text class="score-popup" x="520" y="245" text-anchor="middle">+150 PTS!</text>
    </g>

    <!-- THE SNAKE -->
    <g class="snake-group">
      <!-- Tail & Body Segments -->
      <rect class="seg-5" x="80" y="168" width="24" height="24" rx="6"/>
      <rect class="seg-5" x="110" y="168" width="24" height="24" rx="6"/>
      <rect class="seg-4" x="140" y="168" width="24" height="24" rx="6"/>
      <rect class="seg-3" x="170" y="168" width="24" height="24" rx="6"/>
      <rect class="seg-2" x="200" y="168" width="24" height="24" rx="6"/>
      <rect class="seg-1" x="230" y="168" width="24" height="24" rx="6"/>

      <!-- Animated Snake Head -->
      <g class="snake-head-crawl">
        <rect x="260" y="164" width="32" height="32" rx="8" fill="#00ff88" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)"/>
        <!-- Eyes -->
        <circle cx="282" cy="172" r="4.5" fill="#02050c"/>
        <circle cx="284" cy="171" r="2" fill="#ffffff"/>
        
        <circle cx="282" cy="188" r="4.5" fill="#02050c"/>
        <circle cx="284" cy="187" r="2" fill="#ffffff"/>

        <!-- Flicking Tongue -->
        <path d="M 292 180 L 306 180 L 312 174 M 306 180 L 312 186" stroke="#ff0055" stroke-width="2.5" fill="none"/>
      </g>
    </g>

  </g>

  <!-- Bottom Instructions -->
  <text class="retro-text" x="400" y="345" text-anchor="middle" font-size="11" fill="#00ff88">🐍 HOVER OVER ANY GLOWING FOOD APPLE TO MAKE THE CYBER SNAKE CHOMP IT! 🍎</text>
</svg>