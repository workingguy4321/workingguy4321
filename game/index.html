<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CYBER SNAKE ARCADE 🐍 // workingguy4321</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #030712;
      color: #00ff88;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #arcade-container {
      position: relative;
      background: #090e1a;
      border: 3px solid #00ff88;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ff88;
    }
    .score-label { color: #00ff88; }
    .hi-score-label { color: #ffe600; }
    canvas {
      background: radial-gradient(circle at center, #0d1527 0%, #050914 100%);
      border: 2px solid #1e293b;
      border-radius: 8px;
      display: block;
    }
    #game-over-modal, #start-modal {
      position: absolute;
      top: 60px;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: rgba(3, 7, 18, 0.92);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    h1 {
      font-size: 34px;
      color: #00ff88;
      text-shadow: 0 0 20px #00ff88;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    p {
      color: #cbd5e1;
      font-size: 15px;
      margin: 6px 0;
    }
    .controls-box {
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid #00ff88;
      padding: 10px 20px;
      border-radius: 6px;
      margin: 15px 0;
      font-size: 14px;
      color: #38bdf8;
    }
    button {
      background: linear-gradient(135deg, #00ff88, #0ea5e9);
      color: #020617;
      border: none;
      padding: 12px 32px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
    }
    #footer-tag {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
    #footer-tag a {
      color: #00ff88;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="arcade-container">
    <div id="scoreboard">
      <div class="score-label">🍎 SCORE: <span id="score-display">0</span></div>
      <div class="hi-score-label">🏆 BEST: <span id="best-display">0</span></div>
    </div>

    <canvas id="snakeCanvas" width="600" height="480"></canvas>

    <!-- Start Modal -->
    <div id="start-modal">
      <h1>🐍 CYBER SNAKE ARCADE 🐍</h1>
      <p>Guide the cyber snake, consume glowing energy apples, and avoid walls!</p>
      <div class="controls-box">
        🕹️ <b>CONTROLS:</b><br>
        • Move: <b>Arrow Keys</b> or <b>W / A / S / D</b><br>
        • Swipe on Touchscreens
      </div>
      <button id="start-btn">INSERT COIN // PLAY</button>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" style="display: none;">
      <h1 style="color: #ff0055;">GAME OVER</h1>
      <p style="font-size: 20px;">YOUR SCORE: <span id="final-score" style="color: #ffe600; font-weight: bold;">0</span></p>
      <div style="margin: 15px 0;">
        <button id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <div id="footer-tag">
    Developed by <a href="https://github.com/workingguy4321" target="_blank">workingguy4321</a> • Arcade Series
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');

    // Web Audio Synthesizer (Zero sound files required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'crash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    const gridSize = 20;
    const tileCountX = canvas.width / gridSize;
    const tileCountY = canvas.height / gridSize;

    let snake = [];
    let velocity = { x: 0, y: 0 };
    let food = { x: 15, y: 12 };
    let score = 0;
    let bestScore = localStorage.getItem('cyber_snake_best') || 0;
    document.getElementById('best-display').innerText = bestScore;

    let gameInterval = null;
    let isRunning = false;
    let nextDirection = { x: 0, y: 0 };

    function initSnake() {
      snake = [
        { x: 10, y: 12 },
        { x: 9, y: 12 },
        { x: 8, y: 12 },
        { x: 7, y: 12 }
      ];
      velocity = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      document.getElementById('score-display').innerText = score;
      placeFood();
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCountX),
        y: Math.floor(Math.random() * tileCountY)
      };
      // Ensure food doesn't spawn on snake
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          placeFood();
          break;
        }
      }
    }

    function update() {
      velocity = { ...nextDirection };

      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Wall Collision
      if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
        gameOver();
        return;
      }

      // Self Collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Check food consumption
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score-display').innerText = score;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('cyber_snake_best', bestScore);
          document.getElementById('best-display').innerText = bestScore;
        }
        playBeep('eat');
        placeFood();
      } else {
        snake.pop();
      }
    }

    function render() {
      // Clear Board
      ctx.fillStyle = '#090e1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Subtle Grid
      ctx.strokeStyle = '#111e33';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Glowing Food Apple
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ff0055';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Food Stem
      ctx.fillStyle = '#84cc16';
      ctx.fillRect(food.x * gridSize + gridSize / 2 - 1, food.y * gridSize + 2, 2, 4);
      ctx.shadowBlur = 0;

      // Draw Snake
      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        if (i === 0) {
          // Snake Head
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 12;
          ctx.fillStyle = '#00ff88';
          ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);

          // Eyes
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#020617';
          if (velocity.x === 1) {
            ctx.fillRect(seg.x * gridSize + 12, seg.y * gridSize + 4, 3, 3);
            ctx.fillRect(seg.x * gridSize + 12, seg.y * gridSize + 13, 3, 3);
          } else if (velocity.x === -1) {
            ctx.fillRect(seg.x * gridSize + 4, seg.y * gridSize + 4, 3, 3);
            ctx.fillRect(seg.x * gridSize + 4, seg.y * gridSize + 13, 3, 3);
          } else if (velocity.y === -1) {
            ctx.fillRect(seg.x * gridSize + 4, seg.y * gridSize + 4, 3, 3);
            ctx.fillRect(seg.x * gridSize + 13, seg.y * gridSize + 4, 3, 3);
          } else {
            ctx.fillRect(seg.x * gridSize + 4, seg.y * gridSize + 12, 3, 3);
            ctx.fillRect(seg.x * gridSize + 13, seg.y * gridSize + 12, 3, 3);
          }
        } else {
          // Snake Body Gradient
          ctx.shadowBlur = 0;
          ctx.fillStyle = `hsl(${145 - i * 1.5}, 100%, ${Math.max(30, 50 - i * 0.8)}%)`;
          ctx.fillRect(seg.x * gridSize + 1.5, seg.y * gridSize + 1.5, gridSize - 3, gridSize - 3);
        }
      }
    }

    function gameLoop() {
      if (isRunning) {
        update();
        render();
      }
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      playBeep('crash');
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over-modal').style.display = 'flex';
    }

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && velocity.y === 0) {
        nextDirection = { x: 0, y: -1 };
      }
      if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && velocity.y === 0) {
        nextDirection = { x: 0, y: 1 };
      }
      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && velocity.x === 0) {
        nextDirection = { x: -1, y: 0 };
      }
      if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && velocity.x === 0) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    // Mobile / Swipe support
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!isRunning) return;
      e.preventDefault();
      const touchEndX = e.touches[0].clientX;
      const touchEndY = e.touches[0].clientY;
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30 && velocity.x === 0) nextDirection = { x: 1, y: 0 };
        else if (dx < -30 && velocity.x === 0) nextDirection = { x: -1, y: 0 };
      } else {
        if (dy > 30 && velocity.y === 0) nextDirection = { x: 0, y: 1 };
        else if (dy < -30 && velocity.y === 0) nextDirection = { x: 0, y: -1 };
      }
    }, { passive: false });

    // Buttons
    document.getElementById('start-btn').addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('start-modal').style.display = 'none';
      initSnake();
      isRunning = true;
      gameInterval = setInterval(gameLoop, 95); // 95ms snake speed
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('game-over-modal').style.display = 'none';
      initSnake();
      isRunning = true;
      gameInterval = setInterval(gameLoop, 95);
    });

    render();
  </script>
</body>
</html>
